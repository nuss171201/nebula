included:
  - App
  - Packages
excluded:
  - build
  - Vendor
  - "**/.build"

# Formatting is owned by SwiftFormat; these rules disagree with its output.
disabled_rules:
  - trailing_comma
  - opening_brace
  - statement_position
  # Misfires on ternaries that produce enum values inside switch expressions.
  - void_function_in_ternary

opt_in_rules:
  - empty_count
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional

line_length:
  warning: 160
  error: 200
  ignores_comments: true

identifier_name:
  min_length: 2
  excluded:
    - db
    - tv
    - id
    - x
    - y

# A flat `switch` that maps one value to another is a table, not a tangle.
cyclomatic_complexity:
  ignores_case_statements: true

nesting:
  type_level: 2

large_tuple:
  warning: 3
  error: 4

type_body_length:
  warning: 300
file_length:
  warning: 500
function_body_length:
  warning: 60
