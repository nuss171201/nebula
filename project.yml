# XcodeGen spec. The .xcodeproj is generated and not committed:
#   xcodegen generate
#
# Project, target, scheme and module are named "MediaCenter" on purpose so that
# renaming the product only touches Config/Branding.xcconfig.
name: MediaCenter

options:
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  deploymentTarget:
    macOS: "14.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  MediaCore:
    path: Packages/MediaCore
  MediaLibrary:
    path: Packages/MediaLibrary
  StreamEngine:
    path: Packages/StreamEngine
  PlayerKit:
    path: Packages/PlayerKit
  AppUI:
    path: Packages/AppUI
  WatchParty:
    path: Packages/WatchParty
  # Pinned exactly, like the packages' own dependencies: the generated project is not committed.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

targets:
  MediaCenter:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Config/DefaultAddons.json
        buildPhase: resources
      # The Acknowledgements window: what third-party code is in the app, and its licence texts
      # (collected into Vendor/Licenses by Scripts/collect-licenses.sh; copied as Resources/Licenses).
      - path: Config/ThirdParty.json
        buildPhase: resources
      - path: Vendor/Licenses
        type: folder
        buildPhase: resources
      # The audio conversion helper (Scripts/build-ffmpeg-helper.sh), next to the app's own binary,
      # which is where AudioTranscoder looks for it.
      - path: Vendor/Helpers/ffmpeg
        buildPhase:
          copyFiles:
            destination: executables
        attributes: [CodeSignOnCopy]
    dependencies:
      - package: MediaCore
      - package: PlayerKit
      - package: AppUI
      - package: WatchParty
      - package: Sparkle

schemes:
  MediaCenter:
    build:
      targets:
        MediaCenter: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: MediaCore/MediaCoreTests
        - package: MediaLibrary/MediaLibraryTests
        - package: StreamEngine/StreamEngineTests
        - package: PlayerKit/PlayerKitTests
        - package: AppUI/AppUITests
        - package: WatchParty/WatchPartyTests
    profile:
      config: Release
    archive:
      config: Release
